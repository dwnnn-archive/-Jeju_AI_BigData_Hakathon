[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jeju-curtailment-backend"
version = "0.1.0"
description = "Jeju curtailment decision-support API and persistent LangGraph agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "httpx>=0.28,<1", "filelock>=3.17,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
ml = ["xgboost>=3,<4", "numpy>=2,<3"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
